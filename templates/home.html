{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Recent Posts</h2>

{% for post in posts %}

<div class="card mb-3 shadow-sm">
    <div class="card-body">

        <h5 class="card-title">
            {{ post.user.username }}
        </h5>

        <p class="card-text">
            {{ post.text }}
        </p>

        <small class="text-muted">
            {{ post.created_at }}
        </small>

    </div>
</div>

{% empty %}

<div class="alert alert-info">
    No posts available.
</div>

{% endfor %}

{% endblock %}
