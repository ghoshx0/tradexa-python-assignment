{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header">
                <h3>Create Post</h3>
            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn btn-primary">
                        Create Post
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
